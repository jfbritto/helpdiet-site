name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-helpdiet
      cancel-in-progress: false

    steps:
      # Sem job de teste: e HTML e CSS estaticos, nao ha o que testar em CI que
      # o smoke test do deploy ja nao cubra.
      #
      # O CSS compilado (dist/style.css) e versionado de proposito, entao o CI
      # tambem nao precisa de node nem de build do Tailwind. Se um dia o build
      # entrar aqui, o VPS continua sem precisar de node.
      #
      # Sem guarda de sessao: o deploy-static.sh nao faz artisan down. Nao ha
      # indisponibilidade a evitar — o nginx passa a servir os arquivos novos na
      # requisicao seguinte ao reset.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # sudo porque o deploy-static.sh faz chown e chmod. O sudoers libera
          # NOPASSWD apenas para este wrapper, que e root:root 755 e o usuario
          # deploy nao pode editar.
          script: sudo /home/deploy/deploy-helpdiet.sh
